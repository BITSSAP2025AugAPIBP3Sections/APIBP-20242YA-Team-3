# This workflow is TEMPORARILY configured to run ONLY the Lint Documentation job
# to allow continuous integration for documentation while other parts of the
# application are being fixed and debugged.
name: CI/CD Pipeline

# Defines the events that trigger the workflow
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Lint Docs Job: Runs documentation checks. This is the only enabled job.
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Check markdown files
      uses: articulate/actions-markdownlint@v1
      with:
        config: .markdownlint.json
        files: '**/*.md'
        ignore: node_modules
      # Allows this job to pass even if linting issues are found (soft failure)
      continue-on-error: true

  # The 'test' and 'build' jobs have been temporarily removed based on your request
  # to remove the failing and skipped checks. Remember to re-introduce them
  # once your application code issues are resolved!