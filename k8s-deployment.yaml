apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-api
  labels:
    app: service-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-api
  template:
    metadata:
      labels:
        app: service-api
    spec:
      containers:
        - name: service-api
          image: service-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: service-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: service-api
spec:
  type: NodePort
  selector:
    app: service-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080

